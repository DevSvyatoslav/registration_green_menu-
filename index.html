<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Menu</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <button class="lang-btn" id="langBtn" type="button">EN</button>

  <div class="login-container">
    <form action="/register" method="POST">
      <h2 data-ru="Регистрация" data-en="Sign Up">Регистрация</h2>

      <div>
        <label for="username" data-ru="Имя пользователя:" data-en="Username:">Имя пользователя:</label>
        <input type="text" id="username" name="username" required>
      </div>

      <div>
        <label for="email" data-ru="Электронная почта:" data-en="Email:">Электронная почта:</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div>
        <label for="password" data-ru="Пароль:" data-en="Password:">Пароль:</label>
        <input type="password" id="password" name="password" required>
      </div>

      <div>
        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms" data-ru="Я согласен с условиями" data-en="I agree to the terms">Я согласен с условиями</label>
      </div>

      <button type="submit" data-ru="Зарегистрироваться" data-en="Create Account">Зарегистрироваться</button>
    </form>
  </div>

  <div id="modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-icon">✓</div>
      <h3 data-ru="Успешно!" data-en="Success!">Успешно!</h3>
      <p data-ru="Вы успешно зарегистрировались." data-en="You have registered successfully.">Вы успешно зарегистрировались.</p>
      <button id="modal-close" data-ru="Отлично" data-en="Great">Отлично</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
